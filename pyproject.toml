[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "call-sketch"
version = "0.2.0"
description = "Escuta a conversa (Discord, Meet, qualquer audio do PC) e o Claude transforma as falas em diagramas ao vivo."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "faster-whisper>=1.1",
    "soundcard>=0.4.3",
    "numpy>=1.26",
    "edge-tts>=7.0",
    "miniaudio>=1.61",
]

[project.optional-dependencies]
# Whisper na GPU NVIDIA (Windows/Linux)
gpu = ["nvidia-cublas-cu12", "nvidia-cudnn-cu12>=9,<10"]
# usar a API paga da Anthropic em vez do login do Claude Code
api = ["anthropic>=2.10"]
dev = ["pytest>=8", "ruff>=0.8"]

[project.scripts]
call-sketch = "call_sketch.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/call_sketch"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
