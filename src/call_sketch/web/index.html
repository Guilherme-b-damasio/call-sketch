<!doctype html>
<html lang="pt-br">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Call Sketch</title>
<style>
  :root { --bg:#fafaf7; --fg:#1d1d1b; --muted:#77736a; --line:#e4e1d8; --accent:#d9480f; --blue:#1971c2; --panel:#fff; }
  @media (prefers-color-scheme: dark) { :root { --bg:#161614; --fg:#ecebe6; --muted:#9a968c; --line:#2c2b27; --panel:#1e1e1b; --blue:#4dabf7; } }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font:14px/1.45 "Segoe UI", system-ui, sans-serif; height:100vh; display:grid; grid-template-columns:1fr 360px; }
  main { position:relative; overflow:auto; display:flex; align-items:center; justify-content:center; padding:24px; }
  #diagram { width:100%; height:100%; display:flex; align-items:center; justify-content:center; }
  #diagram svg { width:100% !important; max-width:100% !important; height:100% !important; font-family:"Segoe UI", system-ui, sans-serif; }
  #empty { color:var(--muted); font-size:18px; text-align:center; }
  #badge { position:absolute; top:14px; left:16px; font-size:12px; color:var(--muted); }
  #badge b { color:var(--fg); }
  aside { border-left:1px solid var(--line); background:var(--panel); display:flex; flex-direction:column; min-height:0; }
  header { padding:12px 14px; border-bottom:1px solid var(--line); display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
  header b { flex:1; }
  button, select { font:inherit; border:1px solid var(--line); background:var(--bg); color:var(--fg); border-radius:6px; padding:4px 10px; cursor:pointer; }
  button:hover, select:hover { border-color:var(--accent); }
  .row { padding:8px 14px; border-bottom:1px solid var(--line); display:flex; gap:8px; align-items:center; }
  .row label { color:var(--muted); font-size:12px; }
  .row select { flex:1; }
  #status { padding:6px 14px; color:var(--muted); font-size:12px; border-bottom:1px solid var(--line); }
  #status.busy::before { content:"● "; color:var(--accent); }
  #checks { max-height:35%; overflow:auto; padding:8px 14px; border-bottom:1px solid var(--line); }
  h4 { margin:0 0 6px; font-size:12px; text-transform:uppercase; letter-spacing:.05em; color:var(--muted); }
  .c { margin:0 0 6px; padding:6px 8px; border-radius:6px; border-left:3px solid #e8590c; background:color-mix(in srgb, #e8590c 10%, transparent); }
  .c.duvida { border-color:#f59f00; background:color-mix(in srgb, #f59f00 10%, transparent); }
  .c small, .l small { color:var(--muted); margin-right:4px; }
  .none { color:var(--muted); margin:0; font-size:12px; }
  #log { flex:1; overflow:auto; padding:10px 14px; }
  .l { margin:0 0 8px; } .w { font-weight:600; }
  .w.eu { color:var(--accent); } .w.nota { color:var(--blue); }
  form { display:flex; gap:6px; padding:10px 14px; border-top:1px solid var(--line); }
  input { flex:1; font:inherit; padding:6px 8px; border:1px solid var(--line); border-radius:6px; background:var(--bg); color:var(--fg); }
  #err { position:absolute; bottom:12px; left:12px; right:12px; color:#c92a2a; font-size:12px; white-space:pre-wrap; }
  @media (max-width:800px) { body { grid-template-columns:1fr; grid-template-rows:60vh 40vh; } aside { border-left:0; border-top:1px solid var(--line); } }
</style>
</head>
<body>
<main>
  <div id="badge"></div>
  <div id="diagram"><div id="empty">Falem aí que eu desenho…</div></div>
  <div id="err"></div>
</main>
<aside>
  <header>
    <b>Call Sketch</b>
    <button id="redraw" title="Desenhar agora">Redesenhar</button>
    <button id="copy" title="Copiar o código Mermaid">Copiar</button>
    <button id="reset">Limpar</button>
  </header>
  <div class="row"><label for="mode">Modo</label><select id="mode"></select></div>
  <div id="status">…</div>
  <div id="checks"><h4>Validação</h4><div id="clist"><p class="none">Nada a corrigir ainda.</p></div></div>
  <div id="log"></div>
  <form id="note"><input name="t" placeholder="Pedido pro desenho (ex: separa front e back)"><button>Enviar</button></form>
</aside>
<script type="module">
import mermaid from "https://cdn.jsdelivr.net/npm/mermaid@11.4.1/dist/mermaid.esm.min.mjs";

const dark = matchMedia("(prefers-color-scheme: dark)").matches;
// a fonte do mermaid tem que ser a mesma da pagina, senao ele mede errado e corta o texto
const FONT = "Segoe UI, system-ui, sans-serif";
// cores dos ramos do mindmap/timeline (cScale); o tema base deixa preto no escuro
const SCALE = dark
  ? ["#1c3d5a", "#5a3a1c", "#1f4d3a", "#4a2a52", "#5a1f2b", "#3d4a1c", "#1c4a4a", "#4a3d1c"]
  : ["#d0ebff", "#ffe8cc", "#d3f9d8", "#eebefa", "#ffe3e3", "#e9fac8", "#c5f6fa", "#fff3bf"];
const scaleVars = Object.fromEntries(SCALE.flatMap((c, i) => [
  [`cScale${i}`, c], [`cScaleLabel${i}`, dark ? "#ecebe6" : "#1d1d1b"],
]));
mermaid.initialize({
  startOnLoad:false, securityLevel:"strict", theme:"base",
  themeVariables: dark
    ? { ...scaleVars, darkMode:true, fontFamily:FONT, fontSize:"18px", background:"#161614", primaryColor:"#25303b",
        primaryBorderColor:"#4dabf7", primaryTextColor:"#ecebe6", lineColor:"#9a968c",
        secondaryColor:"#3b2a1f", tertiaryColor:"#1e1e1b", edgeLabelBackground:"#161614" }
    : { ...scaleVars, fontFamily:FONT, fontSize:"18px", primaryColor:"#e7f5ff", primaryBorderColor:"#1971c2",
        primaryTextColor:"#1d1d1b", lineColor:"#77736a", secondaryColor:"#fff4e6", tertiaryColor:"#fafaf7" },
  flowchart: { htmlLabels:true, wrappingWidth:220, padding:16, nodeSpacing:40, rankSpacing:50, curve:"basis" },
});
await document.fonts.ready;

const $ = s => document.querySelector(s);
const post = (p, b = {}) => fetch(p, { method:"POST", body:JSON.stringify(b) });
let version = -1, nLines = -1, nChecks = -1, code = "", modeNames = {};

const modes = await (await fetch("/modes")).json();
for (const m of modes) {
  modeNames[m.id] = m.name;
  const o = document.createElement("option");
  o.value = m.id; o.textContent = m.name; o.title = m.description || "";
  $("#mode").appendChild(o);
}
$("#mode").onchange = e => post("/mode", { mode:e.target.value });

function renderList(box, items, make, emptyHtml, reverse = false) {
  box.innerHTML = items.length ? "" : emptyHtml;
  for (const it of reverse ? [...items].reverse() : items) box.appendChild(make(it));
}

async function tick() {
  try {
    const s = await (await fetch("/state")).json();
    $("#status").textContent = s.status;
    $("#status").className = s.status.startsWith("desenhando") ? "busy" : "";
    if (document.activeElement !== $("#mode")) $("#mode").value = s.mode;
    const active = s.active_mode ? `<b>${modeNames[s.active_mode] ?? s.active_mode}</b>` : "escolhendo…";
    $("#badge").innerHTML = s.mode === "auto" ? `Automático · ${active}` : active;

    if (s.transcript.length !== nLines) {
      nLines = s.transcript.length;
      const log = $("#log"), atBottom = log.scrollTop + log.clientHeight >= log.scrollHeight - 20;
      renderList(log, s.transcript, l => {
        const p = document.createElement("p"); p.className = "l";
        p.innerHTML = '<small></small> <span class="w"></span> <span></span>';
        p.children[0].textContent = l.t;
        p.children[1].textContent = l.who + ":"; p.children[1].classList.add(l.who);
        p.children[2].textContent = l.text;
        return p;
      }, "");
      if (atBottom) log.scrollTop = log.scrollHeight;
    }

    if (s.checks.length !== nChecks) {
      nChecks = s.checks.length;
      renderList($("#clist"), s.checks, c => {
        const p = document.createElement("p");
        p.className = "c" + (c.text.startsWith("[DUVIDA]") ? " duvida" : "");
        p.innerHTML = "<small></small><span></span>";
        p.children[0].textContent = c.t; p.children[1].textContent = c.text;
        return p;
      }, '<p class="none">Nada a corrigir ainda.</p>', true);
    }

    if (s.version !== version) {
      version = s.version; code = s.mermaid;
      if (!code) $("#diagram").innerHTML = '<div id="empty">Falem aí que eu desenho…</div>';
      else {
        try {
          const { svg } = await mermaid.render("d" + version, code);
          $("#diagram").innerHTML = svg; $("#err").textContent = "";
        } catch (e) {
          $("#err").textContent = "Erro no diagrama, pedindo correção… " + (e.message || e);
          post("/render_error", { error:String(e.message || e).slice(0, 500) });
        }
      }
    }
  } catch {}
  setTimeout(tick, 1000);
}
tick();

$("#redraw").onclick = () => post("/redraw");
$("#reset").onclick = () => confirm("Limpar transcrição, notas e desenho?") && post("/reset");
$("#copy").onclick = () => navigator.clipboard.writeText(code);
$("#note").onsubmit = e => {
  e.preventDefault();
  const t = e.target.t.value.trim();
  if (t) post("/note", { text:t });
  e.target.reset();
};
</script>
</body>
</html>
