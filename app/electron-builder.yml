appId: dev.callsketch.app
productName: Call Sketch
directories:
  output: dist
files:
  - out/**
  - package.json
extraResources:
  - from: resources/modes
    to: modes
  # motor de audio empacotado com PyInstaller (engine/build.ps1); sem ele o app usa o Python configurado
  - from: ../engine/dist/call-sketch-engine
    to: engine
    filter: ['**/*']
win:
  target: nsis
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  artifactName: CallSketch-Setup-${version}.${ext}
