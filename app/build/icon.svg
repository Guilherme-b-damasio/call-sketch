<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- Call Sketch: a fala (barras de som) vira um diagrama (as ligacoes e os blocos) -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#a78bfa"/>
      <stop offset="0.55" stop-color="#7c3aed"/>
      <stop offset="1" stop-color="#5b21b6"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.3" cy="0.2" r="0.8">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect x="32" y="32" width="960" height="960" rx="224" fill="url(#bg)"/>
  <rect x="32" y="32" width="960" height="960" rx="224" fill="url(#glow)"/>
  <!-- ligacoes -->
  <path d="M512 396 V500 M300 640 V568 Q300 500 368 500 H656 Q724 500 724 568 V640"
        fill="none" stroke="#ffffff" stroke-width="40" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- a fala -->
  <rect x="292" y="176" width="440" height="220" rx="110" fill="#ffffff"/>
  <g fill="#7c3aed">
    <rect x="374" y="256" width="36" height="60" rx="18"/>
    <rect x="434" y="226" width="36" height="120" rx="18"/>
    <rect x="494" y="200" width="36" height="172" rx="18"/>
    <rect x="554" y="226" width="36" height="120" rx="18"/>
    <rect x="614" y="256" width="36" height="60" rx="18"/>
  </g>
  <!-- o diagrama -->
  <rect x="176" y="640" width="248" height="208" rx="56" fill="#ffffff"/>
  <rect x="600" y="640" width="248" height="208" rx="56" fill="#ffffff"/>
</svg>
