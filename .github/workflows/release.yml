name: release

# Gera os instaladores de Windows, macOS e Linux e anexa direto na release do tag.
# Nao usa artefatos do Actions (o plano gratuito tem so 0,5 GB e os instaladores passam disso).
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag da release que recebe os arquivos (ex: v0.3.0)'
        required: true

permissions:
  contents: write

env:
  TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.tag }}
  GH_TOKEN: ${{ github.token }}

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: cria a release se ainda nao existir
        run: |
          if ! gh release view "$TAG" > /dev/null 2>&1; then
            gh release create "$TAG" --verify-tag --title "Call Sketch $TAG" --notes-file .github/release-notes.md
          fi

  build:
    name: build (${{ matrix.dist }})
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            dist: win
          - os: macos-latest # Apple Silicon
            dist: mac
          - os: ubuntu-22.04 # glibc mais antiga = roda em mais distros
            dist: linux
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: dependencias do sistema (linux)
        if: runner.os == 'Linux'
        # o soundcard precisa de um servidor de audio ja no import (inclusive quando o PyInstaller
        # analisa o pacote e no --check do motor); a maquina do CI nao tem som, entao sobe um PulseAudio
        # com uma saida falsa
        run: |
          sudo apt-get update && sudo apt-get install -y libpulse0 pulseaudio
          pulseaudio --start --exit-idle-time=-1
          pactl load-module module-null-sink sink_name=ci
          pactl info | grep -i "server name"

      - name: motor de audio (PyInstaller)
        working-directory: engine
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[dev]" pyinstaller
          python -m pytest -q
          python build.py

      - name: testes do app
        working-directory: app
        run: |
          npm ci
          npm run typecheck
          npm test

      - name: instalador
        working-directory: app
        run: npm run dist:${{ matrix.dist }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: anexa na release
        working-directory: app/dist
        run: |
          shopt -s nullglob
          files=(*.exe *.dmg *.AppImage *.deb)
          [ ${#files[@]} -gt 0 ] || { echo "nenhum instalador gerado"; exit 1; }
          ls -la "${files[@]}"
          gh release upload "$TAG" "${files[@]}" --clobber
