name: release

# Gera os instaladores de Windows, macOS e Linux. Num tag v*, publica a release com eles.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: build (${{ matrix.dist }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            dist: win
          - os: macos-latest # Apple Silicon
            dist: mac
          - os: ubuntu-22.04 # glibc mais antiga = roda em mais distros
            dist: linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: dependencias do sistema (linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libpulse0

      - name: motor de audio (PyInstaller)
        working-directory: engine
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[dev]" pyinstaller
          python -m pytest -q
          python build.py

      - name: testes do app
        working-directory: app
        run: |
          npm ci
          npm run typecheck
          npm test

      - name: instalador
        working-directory: app
        run: npm run dist:${{ matrix.dist }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - uses: actions/upload-artifact@v4
        with:
          name: callsketch-${{ matrix.dist }}
          if-no-files-found: error
          path: |
            app/dist/*.exe
            app/dist/*.dmg
            app/dist/*.AppImage
            app/dist/*.deb

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: publica a release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -la dist
          # se a release ja existe (ex: criada a mao com so um sistema), so acrescenta/troca os arquivos
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/* --clobber
            gh release edit "$GITHUB_REF_NAME" --notes-file .github/release-notes.md
          else
            gh release create "$GITHUB_REF_NAME" dist/* \
              --title "Call Sketch $GITHUB_REF_NAME" \
              --notes-file .github/release-notes.md
          fi
